# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-march=skylake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=skylake"
MAKEOPTS="-j4 -l5"
EMERGE_DEFAULT_OPTS="-avk --read-news n --with-bdeps=n --jobs=4 --load-average=5"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

FEATURES="${FEATURES} getbinpkg binpkg-request-signature parallel-fetch parallel-install"
USE="dbus elogind dist-kernel ugrd sysusers X pulseaudio alsa ffmpeg extra -jack -jack-client -system-pipewire -netifrc -sysvinit -completions -modemmanager -networkmanager -kernel-install -systemd -systemd-boot -dracut -gnome -gnome-keyring -kde -nvenc -ios -ipod"
ACCEPT_LICENSE="-* @BINARY-REDISTRIBUTABLE @EULA"
